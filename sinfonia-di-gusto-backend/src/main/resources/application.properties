spring.application.name=sinfonia-di-gusto-backend

server.port = 8080

#configurazione db postgrees (fallback per esecuzione in locale)
spring.datasource.url=jdbc:postgresql://localhost:5432/sinfonia_db
spring.datasource.username=postgres
spring.datasource.password=postgrespassword
spring.datasource.driver-class-name=org.postgresql.Driver

#Configurazione JPA / Hibernate
spring.jpa.hibernate.ddl-auto= update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

