version: '3.8'
services:
  postgres-db:
    image: postgres:16-alpine
    container_name: sinfonia-postgres
    restart: always
    environment:
      POSTGRES_DB: sinfonia_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sinfonia-network

  backend-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sinfonia-backend
    restart: always
    cpus: 1.0
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Rome
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/sinfonia_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - postgres-db
    networks:
      - sinfonia-network

volumes:
  postgres_data:
  uploads_data:

networks:
  sinfonia-network:
    driver: bridge
