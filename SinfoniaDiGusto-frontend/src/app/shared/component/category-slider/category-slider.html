<div class="category-slider-wrapper">
    <button class="arrow-btn left" (click)="scrollLeft()" aria-label="Scorri a sinistra">
        <i class="fa-solid fa-chevron-left"></i>
    </button>

    <div class="slider-container" #sliderContainer>
        @for(cat of categories(); track cat.id){
            <div class="category-card" (click)="selectCategory(cat.name.toLowerCase())">
                <div class="img-wrapper">
                    <img [src] = "getImageUrl(cat.imgeUrl)" [alt] = "cat.name">
                </div>
                <span class="category-name">{{ cat.name }}</span>
            </div>
        }
    </div>

    <button class="arrow-btn right" (click)="scrollRight()" aria-label="Scorri a destra">
        <i class="fa-solid fa-chevron-right"></i>
    </button>
</div>
